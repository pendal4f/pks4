<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#e7f5ff"/>
  <rect x="0" y="310" width="800" height="140" fill="#d0ebff"/>

  <!-- вода (Бухта Золотой Рог) -->
  <path d="M0 340c120-35 220-40 340-30s220 30 460 20v110H0z" fill="#4dabf7" opacity="0.3"/>
  <path d="M0 355c100-25 200-30 320-20s220 25 480 15v105H0z" fill="#4dabf7" opacity="0.2"/>
  <path d="M0 370c80-15 180-20 300-10s240 20 500 10v100H0z" fill="#4dabf7" opacity="0.15"/>

  <!-- пилоны моста -->
  <!-- левый пилон -->
  <rect x="240" y="160" width="30" height="160" fill="#a5d8ff"/>
  <rect x="237" y="158" width="36" height="10" fill="#74c0fc"/>
  <rect x="237" y="165" width="36" height="6" fill="#74c0fc"/>
  <rect x="237" y="310" width="36" height="10" fill="#74c0fc"/>

  <!-- правый пилон -->
  <rect x="530" y="160" width="30" height="160" fill="#a5d8ff"/>
  <rect x="527" y="158" width="36" height="10" fill="#74c0fc"/>
  <rect x="527" y="165" width="36" height="6" fill="#74c0fc"/>
  <rect x="527" y="310" width="36" height="10" fill="#74c0fc"/>

  <!-- арки пилонов (верхние) -->
  <path d="M240 170 Q255 145 270 170" fill="none" stroke="#a5d8ff" stroke-width="4"/>
  <path d="M530 170 Q545 145 560 170" fill="none" stroke="#a5d8ff" stroke-width="4"/>

  <!-- ванты (тросы) - левая сторона -->
  <g stroke="#74c0fc" stroke-width="1.5" opacity="0.8">
    <line x1="255" y1="165" x2="320" y2="250"/>
    <line x1="255" y1="165" x2="300" y2="260"/>
    <line x1="255" y1="165" x2="280" y2="270"/>
    <line x1="255" y1="165" x2="260" y2="280"/>
    <line x1="255" y1="165" x2="340" y2="240"/>
    <line x1="255" y1="165" x2="360" y2="230"/>
    <line x1="255" y1="165" x2="380" y2="225"/>
  </g>

  <!-- ванты (тросы) - правая сторона -->
  <g stroke="#74c0fc" stroke-width="1.5" opacity="0.8">
    <line x1="545" y1="165" x2="480" y2="250"/>
    <line x1="545" y1="165" x2="500" y2="260"/>
    <line x1="545" y1="165" x2="520" y2="270"/>
    <line x1="545" y1="165" x2="540" y2="280"/>
    <line x1="545" y1="165" x2="460" y2="240"/>
    <line x1="545" y1="165" x2="440" y2="230"/>
    <line x1="545" y1="165" x2="420" y2="225"/>
  </g>

  <!-- полотно моста -->
  <rect x="180" y="280" width="440" height="12" fill="#74c0fc"/>
  <rect x="180" y="280" width="440" height="3" fill="#a5d8ff"/>

  <!-- ограждения моста -->
  <line x1="185" y1="278" x2="615" y2="278" stroke="#4dabf7" stroke-width="2"/>

  <!-- стойки ограждения -->
  <g stroke="#4dabf7" stroke-width="1.5">
    <line x1="200" y1="280" x2="200" y2="275"/>
    <line x1="230" y1="280" x2="230" y2="275"/>
    <line x1="260" y1="280" x2="260" y2="275"/>
    <line x1="290" y1="280" x2="290" y2="275"/>
    <line x1="320" y1="280" x2="320" y2="275"/>
    <line x1="350" y1="280" x2="350" y2="275"/>
    <line x1="380" y1="280" x2="380" y2="275"/>
    <line x1="410" y1="280" x2="410" y2="275"/>
    <line x1="440" y1="280" x2="440" y2="275"/>
    <line x1="470" y1="280" x2="470" y2="275"/>
    <line x1="500" y1="280" x2="500" y2="275"/>
    <line x1="530" y1="280" x2="530" y2="275"/>
    <line x1="560" y1="280" x2="560" y2="275"/>
    <line x1="590" y1="280" x2="590" y2="275"/>
  </g>

  <!-- опоры моста (под полотном) -->
  <rect x="250" y="292" width="15" height="25" fill="#a5d8ff" opacity="0.6"/>
  <rect x="540" y="292" width="15" height="25" fill="#a5d8ff" opacity="0.6"/>

  <!-- береговая линия -->
  <path d="M0 310 L120 310 L120 320 Q80 325 0 320 Z" fill="#8b9a6e" opacity="0.5"/>
  <path d="M680 310 L800 310 L800 320 Q750 325 680 320 Z" fill="#8b9a6e" opacity="0.5"/>

  <!-- текст -->
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="bold" fill="#0b3558">
    Владивосток
  </text>
  
  <!-- солнце -->
  <circle cx="680" cy="65" r="28" fill="#ffd43b" opacity="0.7"/>
  <g stroke="#ffc107" stroke-width="2" opacity="0.5">
    <line x1="680" y1="25" x2="680" y2="15"/>
    <line x1="680" y1="105" x2="680" y2="115"/>
    <line x1="640" y1="65" x2="630" y2="65"/>
    <line x1="720" y1="65" x2="730" y2="65"/>
  </g>

  <!-- облака -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="120" cy="130" rx="45" ry="18"/>
    <ellipse cx="155" cy="120" rx="30" ry="14"/>
    <ellipse cx="90" cy="125" rx="22" ry="12"/>

    <ellipse cx="560" cy="100" rx="38" ry="16"/>
    <ellipse cx="590" cy="90" rx="26" ry="12"/>
    <ellipse cx="535" cy="95" rx="20" ry="10"/>
  </g>

  <!-- птицы -->
  <g fill="none" stroke="#0b3558" stroke-width="1.2" opacity="0.4">
    <path d="M300,150 Q305,142 310,150 Q315,142 320,150"/>
    <path d="M330,138 Q335,130 340,138 Q345,130 350,138"/>
    <path d="M315,163 Q320,155 325,163 Q330,155 335,163"/>
  </g>

  <!-- кораблик на воде -->
  <g fill="#0b3558" opacity="0.4">
    <path d="M140,360 L160,360 L155,370 L145,370 Z"/>
    <line x1="150" y1="360" x2="150" y2="350" stroke="#0b3558" stroke-width="1"/>
    <path d="M150,350 L155,355 L150,358 Z" fill="#0b3558"/>
  </g>
</svg>