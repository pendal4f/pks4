<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#fff5f5"/>
  <rect x="0" y="315" width="800" height="135" fill="#ffe3e3"/>

  <!-- вода (Волга) -->
  <path d="M0 360c150-35 250-35 400 0s250 35 400 0v90H0z" fill="#4dabf7" opacity="0.22"/>

  <!-- блики на воде -->
  <g fill="#4dabf7" opacity="0.15">
    <ellipse cx="200" cy="380" rx="60" ry="8"/>
    <ellipse cx="500" cy="390" rx="80" ry="6"/>
    <ellipse cx="650" cy="375" rx="50" ry="7"/>
  </g>

  <!-- стена кремля -->
  <rect x="150" y="250" width="500" height="80" fill="#c92a2a"/>

  <!-- тень под стеной -->
  <rect x="150" y="310" width="500" height="5" fill="#8b1e1e" opacity="0.5"/>

  <!-- зубцы -->
  <g fill="#a51111">
    <rect x="150" y="230" width="20" height="20"/>
    <rect x="180" y="230" width="20" height="20"/>
    <rect x="210" y="230" width="20" height="20"/>
    <rect x="240" y="230" width="20" height="20"/>
    <rect x="270" y="230" width="20" height="20"/>
    <rect x="300" y="230" width="20" height="20"/>
    <rect x="330" y="230" width="20" height="20"/>
    <rect x="360" y="230" width="20" height="20"/>
    <rect x="390" y="230" width="20" height="20"/>
    <rect x="420" y="230" width="20" height="20"/>
    <rect x="450" y="230" width="20" height="20"/>
    <rect x="480" y="230" width="20" height="20"/>
    <rect x="510" y="230" width="20" height="20"/>
    <rect x="540" y="230" width="20" height="20"/>
    <rect x="570" y="230" width="20" height="20"/>
    <rect x="600" y="230" width="20" height="20"/>
    <rect x="630" y="230" width="20" height="20"/>
  </g>

  <!-- башни -->
  <!-- левая (Георгиевская) -->
  <rect x="170" y="180" width="60" height="150" fill="#c92a2a"/>
  <polygon points="170,180 200,140 230,180" fill="#a51111"/>
  <rect x="185" y="195" width="8" height="15" fill="#ffd8d8"/>
  <rect x="207" y="195" width="8" height="15" fill="#ffd8d8"/>

  <!-- центральная (Дмитриевская) -->
  <rect x="360" y="160" width="80" height="170" fill="#c92a2a"/>
  <polygon points="360,160 400,110 440,160" fill="#a51111"/>
  <circle cx="400" cy="200" r="14" fill="#f8f9fa" stroke="#8b1e1e" stroke-width="1.5"/>
  <line x1="400" y1="200" x2="400" y2="192" stroke="#8b1e1e" stroke-width="2"/>
  <line x1="400" y1="200" x2="407" y2="203" stroke="#8b1e1e" stroke-width="2"/>

  <!-- ворота в центральной башне -->
  <rect x="388" y="260" width="24" height="30" rx="12" fill="#6b1414"/>
  <rect x="388" y="260" width="24" height="5" fill="#8b1e1e"/>

  <!-- правая (Кладовая) -->
  <rect x="570" y="180" width="60" height="150" fill="#c92a2a"/>
  <polygon points="570,180 600,140 630,180" fill="#a51111"/>
  <rect x="585" y="195" width="8" height="15" fill="#ffd8d8"/>
  <rect x="607" y="195" width="8" height="15" fill="#ffd8d8"/>

  <!-- дополнительные малые башни между основными -->
  <rect x="270" y="210" width="30" height="70" fill="#c92a2a"/>
  <polygon points="270,210 285,185 300,210" fill="#a51111"/>
  <rect x="280" y="230" width="10" height="20" fill="#ffd8d8"/>

  <rect x="500" y="210" width="30" height="70" fill="#c92a2a"/>
  <polygon points="500,210 515,185 530,210" fill="#a51111"/>
  <rect x="510" y="230" width="10" height="20" fill="#ffd8d8"/>

  <!-- окна/бойницы в стене -->
  <rect x="322" y="270" width="8" height="15" fill="#ffd8d8"/>
  <rect x="470" y="270" width="8" height="15" fill="#ffd8d8"/>
  
  <!-- текст -->
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="bold" fill="#842029">
    Нижний Новгород
  </text>
  
  <!-- облака -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="130" cy="130" rx="40" ry="18"/>
    <ellipse cx="160" cy="120" rx="28" ry="14"/>
    <ellipse cx="105" cy="125" rx="22" ry="12"/>

    <ellipse cx="620" cy="100" rx="35" ry="16"/>
    <ellipse cx="645" cy="92" rx="25" ry="12"/>
    <ellipse cx="598" cy="95" rx="20" ry="10"/>
  </g>

  <!-- деревья на склоне -->
  <g fill="#2b8a3e" opacity="0.7">
    <circle cx="140" cy="295" r="10"/>
    <circle cx="135" cy="290" r="8"/>
    <circle cx="148" cy="288" r="7"/>

    <circle cx="660" cy="290" r="11"/>
    <circle cx="652" cy="285" r="9"/>
    <circle cx="668" cy="283" r="8"/>
  </g>
  <rect x="138" y="300" width="5" height="12" fill="#5c3e1b"/>
  <rect x="658" y="300" width="5" height="12" fill="#5c3e1b"/>
</svg>