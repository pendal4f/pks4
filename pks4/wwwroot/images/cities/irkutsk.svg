    <rect x="340" y="250" width="16" height="28" rx="8"/>
    <rect x="380" y="250" width="40" height="35" rx="12"/>
    <rect x="445" y="250" width="16" height="28" rx="8"/>
    <rect x="490" y="250" width="16" height="28" rx="8"/>
    <rect x="535" y="250" width="16" height="28" rx="8"/>
