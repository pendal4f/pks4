  <path d="M390,115 Q400,95 410,115" fill="#f08c00"/>
  <polygon points="400,95 403,105 397,105" fill="#ffd43b"/>

  <!-- крест -->
  <line x1="400" y1="80" x2="400" y2="100" stroke="#e8590c" stroke-width="2.5"/>
  <line x1="393" y1="88" x2="407" y2="88" stroke="#e8590c" stroke-width="2.5"/>

  <!-- малые купола верхнего яруса -->
  <!-- левый верхний -->
  <rect x="280" y="195" width="30" height="18" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>
  <ellipse cx="295" cy="185" rx="35" ry="28" fill="#f08c00" stroke="#e8590c" stroke-width="1.5"/>
  <ellipse cx="295" cy="185" rx="35" ry="28" fill="none" stroke="#ffd43b" stroke-width="0.8" opacity="0.5"/>
  <path d="M288,160 Q295,145 302,160" fill="#f08c00"/>
  <line x1="295" y1="140" x2="295" y2="152" stroke="#e8590c" stroke-width="2"/>
  <line x1="290" y1="146" x2="300" y2="146" stroke="#e8590c" stroke-width="2"/>

  <!-- правый верхний -->
  <rect x="490" y="195" width="30" height="18" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>
  <ellipse cx="505" cy="185" rx="35" ry="28" fill="#f08c00" stroke="#e8590c" stroke-width="1.5"/>
  <ellipse cx="505" cy="185" rx="35" ry="28" fill="none" stroke="#ffd43b" stroke-width="0.8" opacity="0.5"/>
  <path d="M498,160 Q505,145 512,160" fill="#f08c00"/>
  <line x1="505" y1="140" x2="505" y2="152" stroke="#e8590c" stroke-width="2"/>
  <line x1="500" y1="146" x2="510" y2="146" stroke="#e8590c" stroke-width="2"/>

