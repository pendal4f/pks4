<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- небо -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb26b"/>
      <stop offset="50%" stop-color="#ffd6a5"/>
      <stop offset="100%" stop-color="#b8c0ff"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d8ff" opacity="0.6"/>
      <stop offset="100%" stop-color="#4dabf7" opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- вода (Ангара) -->
  <rect x="0" y="320" width="800" height="130" fill="url(#water)"/>

  <!-- волны -->
  <g fill="none" stroke="#a5d8ff" stroke-width="1.5" opacity="0.4">
    <path d="M0,350 Q50,345 100,350 Q150,355 200,350 Q250,345 300,350 Q350,355 400,350 Q450,345 500,350 Q550,355 600,350 Q650,345 700,350 Q750,355 800,350"/>
    <path d="M0,370 Q60,365 120,370 Q180,375 240,370 Q300,365 360,370 Q420,375 480,370 Q540,365 600,370 Q660,375 720,370 Q780,365 800,370"/>
    <path d="M0,390 Q40,385 80,390 Q120,395 160,390 Q200,385 240,390 Q280,395 320,390 Q360,385 400,390 Q440,395 480,390 Q520,385 560,390 Q600,395 640,390 Q680,385 720,390 Q760,395 800,390"/>
  </g>

  <!-- отражение собора в воде -->
