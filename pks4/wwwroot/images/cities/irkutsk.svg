  <g fill="none" stroke="#ffd43b" stroke-width="1" opacity="0.5">
    <path d="M360,150 Q370,140 380,150"/>
    <path d="M370,140 Q380,130 390,140"/>
    <path d="M390,135 Q400,125 410,135"/>
    <path d="M380,155 Q390,145 400,155"/>
    <path d="M400,145 Q410,135 420,145"/>
    <path d="M410,155 Q420,145 430,155"/>
    <path d="M420,150 Q430,140 440,150"/>
  </g>

