    <rect x="195" y="320" width="410" height="100" fill="#ffffff"/>
    <rect x="230" y="330" width="340" height="60" fill="#f03e3e"/>
    <rect x="280" y="350" width="240" height="30" fill="#ffffff"/>
    <path d="M340 360c20-30 100-30 120 0z" fill="#f08c00"/>
    <ellipse cx="295" cy="375" rx="35" ry="15" fill="#f08c00" opacity="0.6"/>
    <ellipse cx="505" cy="375" rx="35" ry="15" fill="#f08c00" opacity="0.6"/>
  </g>

  <!-- тень под собором -->
  <ellipse cx="400" cy="315" rx="200" ry="10" fill="#e8590c" opacity="0.15"/>

  <!-- основное здание собора (четверик с закомарами) -->
  <rect x="230" y="210" width="340" height="100" fill="#ffffff" stroke="#e8590c" stroke-width="4"/>

  <!-- цоколь -->
  <rect x="225" y="295" width="350" height="15" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>

  <!-- карниз -->
  <rect x="225" y="207" width="350" height="6" fill="#e8590c"/>

  <!-- закомары (полукруглые завершения стен) -->
  <path d="M240,210 Q265,180 290,210" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <path d="M305,210 Q330,180 355,210" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <path d="M370,210 Q395,180 420,210" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <path d="M435,210 Q460,180 485,210" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <path d="M500,210 Q525,180 550,210" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>

