  <rect x="195" y="190" width="35" height="25" fill="#ffe8cc" stroke="#e8590c" stroke-width="1"/>
  <rect x="191" y="187" width="43" height="5" fill="#e8590c"/>

  <rect x="195" y="230" width="35" height="25" fill="#ffe8cc" stroke="#e8590c" stroke-width="1"/>
  <rect x="191" y="227" width="43" height="5" fill="#e8590c"/>

  <rect x="195" y="270" width="35" height="25" fill="#ffe8cc" stroke="#e8590c" stroke-width="1"/>
  <rect x="191" y="267" width="43" height="5" fill="#e8590c"/>

  <!-- звонница (арочные проёмы) -->
  <rect x="198" y="195" width="10" height="15" fill="#a5d8ff" rx="5"/>
  <rect x="217" y="195" width="10" height="15" fill="#a5d8ff" rx="5"/>
  <rect x="198" y="235" width="10" height="15" fill="#a5d8ff" rx="5"/>
  <rect x="217" y="235" width="10" height="15" fill="#a5d8ff" rx="5"/>

  <!-- шатёр колокольни -->
  <polygon points="195,160 212,100 230,160" fill="#f08c00" stroke="#e8590c" stroke-width="2"/>

  <!-- маковка колокольни -->
  <polygon points="212,100 215,90 209,90" fill="#ffd43b"/>
  <line x1="212" y1="85" x2="212" y2="93" stroke="#e8590c" stroke-width="2"/>
  <line x1="208" y1="89" x2="216" y2="89" stroke="#e8590c" stroke-width="2"/>

  <!-- апсиды -->
  <rect x="555" y="240" width="25" height="55" fill="#ffffff" stroke="#e8590c" stroke-width="2" rx="5"/>
  <ellipse cx="567" cy="235" rx="15" ry="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>

  <!-- береговая линия -->
  <path d="M0 318 Q200 315 400 318 Q600 315 800 318" fill="#d4a373" opacity="0.3"/>

  <!-- трава/газон -->
  <path d="M0 318 Q200 312 400 318 Q600 312 800 318 L800 325 Q600 320 400 325 Q200 320 0 325 Z" fill="#8b9a6e" opacity="0.4"/>

  <!-- подпись -->
  <text x="30" y="55" font-family="Segoe UI, Arial" font-size="34" font-weight="bold" fill="#3b2f2f">
    Иркутск
  </text>
  

  <!-- облака -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="120" cy="140" rx="50" ry="20"/>
    <ellipse cx="160" cy="130" rx="35" ry="16"/>
    <ellipse cx="90" cy="135" rx="25" ry="14"/>

    <ellipse cx="620" cy="120" rx="40" ry="18"/>
    <ellipse cx="650" cy="110" rx="30" ry="14"/>
    <ellipse cx="595" cy="115" rx="22" ry="12"/>
  </g>

  <!-- птицы -->
  <g fill="none" stroke="#3b2f2f" stroke-width="1.5" opacity="0.4">
    <path d="M280,150 Q285,142 290,150 Q295,142 300,150"/>
    <path d="M310,138 Q315,130 320,138 Q325,130 330,138"/>
  </g>
  
</svg>