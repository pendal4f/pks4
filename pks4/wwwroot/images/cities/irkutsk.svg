  <rect x="230" y="285" width="340" height="3" fill="#e8590c" opacity="0.5"/>

  <!-- центральный купол -->
  <rect x="380" y="175" width="40" height="35" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <rect x="375" y="172" width="50" height="6" fill="#e8590c"/>
