    <rect x="293" y="248" width="20" height="32" rx="9"/>
    <rect x="338" y="248" width="20" height="32" rx="9"/>
    <rect x="378" y="248" width="44" height="39" rx="13"/>
    <rect x="443" y="248" width="20" height="32" rx="9"/>
    <rect x="488" y="248" width="20" height="32" rx="9"/>
    <rect x="533" y="248" width="20" height="32" rx="9"/>
