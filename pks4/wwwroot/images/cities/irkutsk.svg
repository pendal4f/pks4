    <path d="M250,240 Q258,230 266,240"/>
    <path d="M295,240 Q303,230 311,240"/>
    <path d="M340,240 Q348,230 356,240"/>
    <path d="M380,240 Q400,225 420,240"/>
    <path d="M445,240 Q453,230 461,240"/>
    <path d="M490,240 Q498,230 506,240"/>
    <path d="M535,240 Q543,230 551,240"/>
  </g>

  <!-- портал (вход) -->
  <rect x="375" y="270" width="50" height="40" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
  <path d="M375,270 Q400,252 425,270" fill="none" stroke="#e8590c" stroke-width="2.5"/>
  <rect x="383" y="280" width="12" height="25" fill="#a5d8ff"/>
  <rect x="405" y="280" width="12" height="25" fill="#a5d8ff"/>

  <!-- килевидный кокошник над входом -->
  <path d="M370,270 Q400,245 430,270" fill="none" stroke="#e8590c" stroke-width="2"/>

