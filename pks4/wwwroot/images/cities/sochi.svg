<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- небо (горное, чистое) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dabf7"/>
      <stop offset="60%" stop-color="#a5d8ff"/>
      <stop offset="100%" stop-color="#e3fafc"/>
    </linearGradient>

    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dee2e6"/>
      <stop offset="100%" stop-color="#adb5bd"/>
    </linearGradient>

    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ced4da"/>
      <stop offset="100%" stop-color="#868e96"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- дальние горы -->
  <polygon points="0,280 100,180 200,220 300,160 400,200 500,170 600,210 700,190 800,240 800,320 0,320" fill="url(#mountain2)" opacity="0.5"/>

  <!-- средние горы -->
  <polygon points="0,300 80,220 160,250 250,200 350,240 450,210 550,250 650,230 750,260 800,250 800,320 0,320" fill="url(#mountain1)"/>

  <!-- ближние горы -->
  <polygon points="0,320 50,260 120,280 200,250 280,270 360,255 440,275 520,260 600,280 680,265 750,285 800,270 800,330 0,330" fill="#adb5bd"/>

  <!-- снег на вершинах -->
  <g fill="#ffffff" opacity="0.8">
    <polygon points="100,180 110,190 115,185 120,195 125,188 130,200 100,185"/>
    <polygon points="300,160 310,170 315,165 320,175 325,168 330,180 305,170"/>
    <polygon points="500,170 510,180 515,175 520,185 505,178"/>
    <polygon points="250,200 255,208 260,204 265,212 250,206"/>
    <polygon points="450,210 458,218 462,214 468,222 455,216"/>
  </g>

  <!-- ели на склонах -->
  <g fill="#2b8a3e">
    <polygon points="60,290 65,270 70,290"/>
    <polygon points="63,280 65,265 67,280"/>
    <polygon points="140,275 145,258 150,275"/>
    <polygon points="143,268 145,253 147,268"/>
    <polygon points="580,275 585,258 590,275"/>
    <polygon points="583,268 585,253 587,268"/>
    <polygon points="700,270 705,255 710,270"/>
    <polygon points="703,265 705,250 707,265"/>
    <polygon points="320,280 324,268 328,280"/>
    <polygon points="322,275 324,263 326,275"/>
  </g>

  <!-- канатная дорога (линия) -->
  <line x1="200" y1="200" x2="400" y2="270" stroke="#212529" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="270" x2="600" y2="250" stroke="#212529" stroke-width="1.5" opacity="0.5"/>

  <!-- опоры канатки -->
  <g stroke="#212529" stroke-width="2">
    <line x1="250" y1="235" x2="250" y2="260"/>
    <line x1="320" y1="255" x2="320" y2="280"/>
    <line x1="500" y1="260" x2="500" y2="285"/>
    <line x1="560" y1="255" x2="560" y2="280"/>
  </g>

  <!-- кабинки канатки -->
  <g fill="#e8590c" opacity="0.7">
    <circle cx="270" cy="227" r="3"/>
    <circle cx="310" cy="241" r="3"/>
    <circle cx="350" cy="252" r="3"/>
    <circle cx="450" cy="265" r="3"/>
    <circle cx="540" cy="258" r="3"/>
    <circle cx="580" cy="252" r="3"/>
  </g>

  <!-- лыжник (маленький силуэт) -->
  <g fill="#212529" opacity="0.7">
    <circle cx="350" cy="262" r="2"/>
    <line x1="350" y1="264" x2="348" y2="270" stroke="#212529" stroke-width="1"/>
    <line x1="350" y1="264" x2="353" y2="271" stroke="#212529" stroke-width="1"/>
    <line x1="348" y1="270" x2="345" y2="275" stroke="#212529" stroke-width="1"/>
    <line x1="353" y1="271" x2="356" y2="276" stroke="#212529" stroke-width="1"/>
  </g>

  <!-- облако над горами -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="650" cy="170" rx="40" ry="15"/>
    <ellipse cx="675" cy="165" rx="25" ry="12"/>
    <ellipse cx="630" cy="168" rx="20" ry="10"/>
  </g>

  <!-- солнце -->
  <circle cx="680" cy="60" r="28" fill="#ffd43b" opacity="0.8"/>
  <g stroke="#ffc107" stroke-width="2" opacity="0.4">
    <line x1="680" y1="20" x2="680" y2="12"/>
    <line x1="680" y1="100" x2="680" y2="108"/>
    <line x1="640" y1="60" x2="632" y2="60"/>
    <line x1="720" y1="60" x2="728" y2="60"/>
  </g>

  <!-- текст -->
  <text x="30" y="60" font-family="Segoe UI, Arial" font-size="38" font-weight="bold" fill="#0b3d5f">
    Сочи
  </text>

  <!-- простые дома внизу -->
  <g fill="#e9ecef" stroke="#adb5bd" stroke-width="1">
    <rect x="100" y="305" width="20" height="18"/>
    <polygon points="98,305 110,298 122,305" fill="#e8590c"/>
    <rect x="130" y="308" width="15" height="15"/>
    <polygon points="129,308 137,302 146,308" fill="#e8590c"/>

    <rect x="620" y="302" width="20" height="20"/>
    <polygon points="618,302 630,295 642,302" fill="#e8590c"/>
    <rect x="650" y="305" width="15" height="17"/>
    <polygon points="649,305 657,299 666,305" fill="#e8590c"/>
  </g>

  <!-- трасса (светлая полоса на горе) -->
  <path d="M280,270 Q300,275 320,280 Q340,285 360,290 Q380,295 400,300" fill="none" stroke="#f8f9fa" stroke-width="4" opacity="0.6"/>
</svg>