<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f0f4f8"/>
  <rect x="0" y="305" width="800" height="145" fill="#d4d9e2"/>

  <!-- памятник "Алёша" (памятник Защитникам Советского Заполярья) - главный монумент -->
  <!-- постамент -->
  <rect x="360" y="240" width="80" height="70" fill="#6c757d"/>
  <rect x="350" y="235" width="100" height="10" fill="#495057"/>

  <!-- фигура солдата -->
  <rect x="385" y="160" width="30" height="75" fill="#495057"/>
  <!-- голова -->
  <circle cx="400" cy="148" r="14" fill="#495057"/>
  <!-- каска -->
  <path d="M386,148 Q400,130 414,148" fill="#343a40"/>
  <rect x="386" y="145" width="28" height="4" fill="#343a40"/>
  <!-- плащ-палатка -->
  <path d="M385,180 Q370,210 365,250 L385,250 L385,180 Z" fill="#6c757d" opacity="0.8"/>
  <path d="M415,180 Q430,210 435,250 L415,250 L415,180 Z" fill="#6c757d" opacity="0.8"/>

  <!-- оружие (автомат) - увеличенное -->
  <rect x="408" y="185" width="6" height="45" fill="#212529"/>
  <rect x="408" y="185" width="22" height="5" fill="#212529"/>
  <!-- приклад -->
  <rect x="408" y="215" width="18" height="6" fill="#343a40"/>
  <!-- магазин -->
  <rect x="414" y="200" width="4" height="15" fill="#212529"/>
  <!-- дуло -->
  <rect x="408" y="182" width="20" height="4" fill="#495057"/>

  <!-- вечный огонь - выше -->
  <ellipse cx="400" cy="310" rx="18" ry="5" fill="#6c757d"/>
  <!-- внешний огонь -->
  <path d="M392,310 Q400,275 408,310" fill="#fd7e14" opacity="0.7"/>
  <!-- средний огонь -->
  <path d="M394,310 Q400,282 406,310" fill="#ffc107" opacity="0.85"/>
  <!-- внутренний огонь -->
  <path d="M396,310 Q400,288 404,310" fill="#fff3bf"/>
  <!-- языки пламени -->
  <path d="M398,310 Q399,280 400,270 Q401,280 402,310" fill="#ffd43b" opacity="0.9"/>

  <!-- сопки (северный пейзаж) -->
  <path d="M0,280 Q100,240 200,260 Q300,230 400,250 Q500,220 600,255 Q700,235 800,260 L800,305 L0,305 Z" fill="#8b9a6e"/>
  <path d="M0,270 Q150,220 250,250 Q350,210 450,240 Q550,200 650,240 Q750,210 800,240 L800,305 L0,305 Z" fill="#7a8a5e"/>

  <!-- северное сияние -->
  <g opacity="0.4">
    <path d="M100,50 Q200,30 300,55 Q400,25 500,50 Q600,20 700,45" stroke="#4dabf7" stroke-width="8" fill="none" opacity="0.5"/>
    <path d="M120,65 Q220,45 320,70 Q420,40 520,65 Q620,35 720,60" stroke="#20c997" stroke-width="6" fill="none" opacity="0.4"/>
    <path d="M80,40 Q180,20 280,45 Q380,15 480,40 Q580,10 680,35" stroke="#9775fa" stroke-width="5" fill="none" opacity="0.3"/>
  </g>

  <!-- текст "Мурманск" -->
  <text x="40" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="bold" fill="#212529">
    Памятник «Алёша
  </text>

  <!-- море (Баренцево) -->
  <g fill="none" stroke="#5f9ea0" stroke-width="2" opacity="0.4">
    <path d="M0,400 Q40,390 80,400 Q120,410 160,400 Q200,390 240,400 Q280,410 320,400 Q360,390 400,400 Q440,410 480,400 Q520,390 560,400 Q600,410 640,400 Q680,390 720,400 Q760,410 800,400"/>
    <path d="M0,415 Q50,405 100,415 Q150,425 200,415 Q250,405 300,415 Q350,425 400,415 Q450,405 500,415 Q550,425 600,415 Q650,405 700,415 Q750,425 800,415"/>
  </g>

  <!-- облака (суровое небо Заполярья) -->
  <g fill="#dee2e6" opacity="0.7">
    <ellipse cx="120" cy="140" rx="50" ry="20"/>
    <ellipse cx="160" cy="130" rx="35" ry="16"/>
    <ellipse cx="90" cy="135" rx="25" ry="12"/>

    <ellipse cx="550" cy="120" rx="45" ry="18"/>
    <ellipse cx="580" cy="112" rx="30" ry="14"/>
    <ellipse cx="525" cy="115" rx="22" ry="11"/>
  </g>

  <!-- птицы (полярные чайки) -->
  <g fill="none" stroke="#2c3e50" stroke-width="1.5" opacity="0.5">
    <path d="M300,160 Q305,152 310,160 Q315,152 320,160"/>
    <path d="M330,145 Q335,137 340,145 Q345,137 350,145"/>
    <path d="M280,175 Q285,167 290,175 Q295,167 300,175"/>
  </g>

  <!-- ели (северные деревья) -->
  <g fill="#2b5e3b" opacity="0.8">
    <polygon points="170,270 180,240 190,270"/>
    <polygon points="175,255 180,230 185,255"/>
    <rect x="178" y="270" width="4" height="12" fill="#5c3e1b"/>

    <polygon points="620,265 632,230 644,265"/>
    <polygon points="626,248 632,220 638,248"/>
    <rect x="630" y="265" width="4" height="12" fill="#5c3e1b"/>
  </g>

  <!-- снег на вершинах сопок -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="250" cy="248" rx="30" ry="8"/>
    <ellipse cx="450" cy="238" rx="25" ry="6"/>

  </g>
</svg>